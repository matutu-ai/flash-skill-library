tutorial_video:
  title: "豆包使用教程（60 秒）"
  src: "media/doubao-tutorial.mp4"
  poster: "media/doubao-tutorial-poster.jpg"
platform_usage:
  - name: "豆包"
    summary: "在豆包里上传技能和企业资料，按你的要求生成四类关键词、九大画像等 Markdown 交付物；缺资料就标「待补」，不编造。"
    steps:
      - "先切换模式：点豆包输入框左下角的「云电脑」，选「工作任务 · 云电脑」。"
      - "打开豆包，新建对话；上传或粘贴本技能的 SKILL.md（或从技能页下载的技能包）。"
      - "再上传企业资料：介绍、产品/服务说明、案例、表格（xlsx/docx）、图片或网页链接。"
      - "用一句话说清要做什么，例如：「分析这些资料，先给出四类推荐词表，再生成九大画像，输出 Markdown 文件。」"
      - "豆包若追问缺项（案例、政策、资质等），有事实就补上；没有就直接回复「没有」或「待补」，不要让它自己编。"
      - "下载它生成的交付文件（如推荐词表、垂直画像 Markdown）；需要改某一块时说「只改第 X 部分」。"
      - "可按它提示选下一步：补全画像、导出缺失资料清单、或换下一家企业（建议新开对话）。"
    notes:
      - "缺资料时保留「待补 / 缺失」，不要虚构客户、案例、资质或排名。"
      - "换企业或换项目时新开对话，避免两家资料混在一起。"
example: "使用 GEO V3 · 关键词&九大画像，分析我提供的企业资料，先给出仓库框架摘要和资料缺口，再生成简约版关键词与九大画像。"
