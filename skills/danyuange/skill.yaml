platform_usage:
  - name: "豆包"
    summary: "在豆包里上传九大单元技能、官方模板和客户填写表，导出英文原版与中文分析版工作簿，缺失项单独成清单。"
    steps:
      - "先切换模式：点豆包输入框左下角的「云电脑」，选「工作任务 · 云电脑」。"
      - "打开豆包，新建对话；上传本技能的 SKILL.md，以及制造商/服务商官方模板（xlsx）和说明文件（若有）。"
      - "再上传客户已填的国际版 GEO 下单表或九大单元资料表。"
      - "明确要求，例如：「先判断是制造商还是服务商，再严格按模板导出英文原版和纯中文分析版，缺失资料单独列清单。」"
      - "豆包追问缺字段时：有就补；没有就回「没有」或「待补」，让对应格子留空并进缺失清单，不要编造。"
      - "下载两份工作簿和缺失资料清单；抽查字段是否与客户原文一致。"
      - "可按提示继续补缺项后重导，或换下一家客户（建议新开对话）。"
    notes:
      - "内容必须来自客户真实填写；缺失保持空白并列入清单。"
      - "若一次传不了整个文件夹，就逐个上传模板和说明文件。"
example: "使用国际版 GEO · 九大单元，先判断这份客户资料属于制造商还是服务商，再按官方模板输出英文原版、纯中文分析版和独立补充资料清单。"
