requirements:
  - "完整 AI 表现判断需要真实 observed 或 provided AI 记录；模拟记录不参与评分。"
  - "竞品与 Evidence 需要来源和状态，缺失数据必须保持 UNKNOWN、NOT_RUN 或 INSUFFICIENT_DATA。"
  - "运行仓库诊断脚本需要 Python 3；默认可使用 ManualProvider 或 OfflineProvider。"
tutorial_video:
  title: "豆包使用教程（60 秒）"
  src: "media/doubao-tutorial.mp4"
  poster: "media/doubao-tutorial-poster.jpg"
platform_usage:
  - name: "豆包"
    summary: "在豆包里上传诊断技能和企业真实资料，生成 GEO 初次诊断报告与行动计划；缺数据标「待补」，不编排名。"
    steps:
      - "打开豆包，新建对话；上传或粘贴本技能的 SKILL.md。"
      - "切换模式：点豆包输入框左下角的「云电脑」，选「工作任务 · 云电脑」。"
      - "再上传企业资料：公司事实、材料、真实 AI 搜索/问答截图或记录、已确认竞品、证据、问题与关键词方向。"
      - "明确要求，例如：「按这个技能做企业初次 GEO 诊断，输出可下载的诊断报告 Markdown，并给出 P0–P3 行动。」"
      - "豆包追问缺项时：有真实观察或竞品就补上；没有就回「没有 / 待补 / 未跑过」，不要让它编模拟排名。"
      - "下载诊断报告等交付文件；需要改某一层（管理层摘要 / 执行层 / 技术层）时直接说明。"
      - "可按它提示选下一步：补资料复测、导出待办清单、或换下一家企业（建议新开对话）。"
    notes:
      - "没有真实 AI 观察时，相关结论标「待补」或「数据不足」，不要写成实时平台排名。"
      - "复测要用同一批问题；换企业请新开对话。"
example: "使用 GEO Diagnostic Engine V3，根据这份企业资料和真实 AI 观察生成 Executive GEO 诊断；缺失数据保持 UNKNOWN，并给出 P0 至 P3 行动与复测计划。"
