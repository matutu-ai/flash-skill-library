requirements:
  - "模型、时长、画幅或参考素材职责未提供时，必须使用保守假设并明确标注。"
  - "不得承诺模型不支持的平台参数；参考人物、Logo、版权角色和真人素材必须符合授权与平台规则。"
  - "Seedance 2.5 最终导出需要同时遵守仓库内的 Seedance 2.5 Export Adapter。"
platform_usage:
  - name: "豆包"
    summary: "在豆包里上传电影叙事导演技能与故事/Brief，拿到中文导演说明和可复制的视频 Prompt；未知参数标假设或「待补」。"
    steps:
      - "打开豆包，新建对话；上传或粘贴本技能的 SKILL.md。"
      - "切换模式：点豆包输入框左下角的「云电脑」，选「工作任务 · 云电脑」。"
      - "再提供故事或视频 Brief，以及参考图/视频；补充已知的模型、时长、画幅、风格和必须保留的元素。"
      - "明确要求，例如：「编排成 12 秒 16:9 心理惊悚片段，输出中文导演说明、完整 Prompt 和质量评分。」"
      - "豆包追问模型、参考图职责或不可改内容时：有就补；没有就回「没有」或「待补」，让它用保守假设并标明，不要虚构平台能力。"
      - "复制导演说明与完整 Prompt；评分低于预期时让它只改不合格的部分。"
      - "把定稿 Prompt 贴到目标模型的生成入口；换故事建议新开对话。"
    notes:
      - "未知参数必须标成假设或「待补」，不要承诺模型不支持的功能。"
      - "本技能负责导演方案与 Prompt，不代替生成入口提交任务。"
example: "使用 Seedance Cinematic Director，把一个女孩在暴雨夜进入废弃医院寻找哥哥的故事，编排成 12 秒 16:9 的心理惊悚片段；保留红色手电筒和雨夜外景，输出中文导演说明、完整 Prompt 与质量评分。"
