input: "产品、人物或场景图片，产品资料，参考视频，完整分镜，广告 Brief，已有提示词或混合视频创意。"
output:
  - "ONE-SHOT PROMPT"
  - "SHOT-BY-SHOT PROMPT"
  - "DIRECTOR PACKAGE"
requirements:
  - "实际视频生成需要 Seedance 2.5、即梦或豆包的相应能力。"
  - "完整流程需要源仓库中的 QUICK-START、workflow、template、schema 与 Human Realism 资源。"
  - "本 Skill 不承担海外市场研究、TikTok 趋势研究或广告投放策略。"
platform_usage:
  - name: "豆包"
    summary: "在豆包里上传商业视频导演技能与产品/人物素材，拿到可直接复制的 Seedance 提示词；缺授权或素材就标「待补」。"
    steps:
      - "打开豆包，新建对话；上传或粘贴本技能的 SKILL.md。"
      - "再上传产品图、人物图、场景图、产品资料、参考视频或广告 Brief。"
      - "明确要求，例如：「编译成 ONE-SHOT 提示词（或分镜版 / 导演包），锁定产品和人物，并做真实感与连续性检查。」"
      - "豆包追问时长、画幅、口播、授权等时：有就补；没有就回「没有」或「待补」，不要让它擅自编产品功能或未授权肖像。"
      - "复制或下载最终提示词文件；需要改某一镜时说「只改第 X 镜」。"
      - "把定稿提示词粘到具备 Seedance 能力的生成入口出片；换项目建议新开对话。"
    notes:
      - "本技能负责分镜与提示词，不代替你在生成入口点「生成」。"
      - "涉及真人、Logo、竞品画面时先确认授权。"
example: "使用 seedance-2-5-prompt，把这组产品图、人物图和 15 秒广告 Brief 编译为 ONE-SHOT PROMPT，锁定产品与人物，并完成 Human Realism、连续性和风险检查。"
