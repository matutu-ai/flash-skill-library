id: seedance-prompt-description
name: Seedance 2.5 提示词描述
subtitle: 锁定人物，也锁定镜头节奏
description: "用固定中文结构整理素材、人物、摄影、时间轴与声音，适合需要角色连续性和明确结束状态的视频项目。"
